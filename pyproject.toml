[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecat"
version = "0.1.0"
description = "Entropy-based Code Adversarial Translation — Android → HarmonyOS multi-agent system"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "anthropic>=0.28",
    "openai>=1.0",
    "matplotlib>=3.9",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "psutil>=5.9",
    "pillow>=10.0",
    "jsonschema>=4.19",
    # feature_checklist 插件解析 xlsx 功能清单；csv/md 走标准库，缺此包时该插件跳过
    "openpyxl>=3.1",
]

[project.urls]
Homepage = "https://arxiv.org/abs/2608.09273"
Paper = "https://arxiv.org/abs/2608.09273"

[project.scripts]
ecat = "ecat.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ecat"]
# Note: `packages = ["src/ecat"]` already bundles every file under src/ecat,
# including non-Python files like src/ecat/seed/**/*.md (skills, prompts).
# Do NOT add a `force-include` for seed/ — newer hatchling treats it as a
# duplicate path and the wheel build fails with ValueError.
# Keep node_modules OUT of the wheel; they are dev-only and not shipped.
exclude = [
  "**/node_modules",
  "**/node_modules/**",
  "**/__pycache__",
  "**/*.pyc",
]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"
extend-exclude = ["src/ecat/seed"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src/ecat"]
exclude = ["src/ecat/seed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end tests (deselect with '-m not e2e')",
]
